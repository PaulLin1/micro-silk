# fly.toml app configuration file generated for micro-silk on 2026-07-27T22:14:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'micro-silk'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine always warm: a cold start pays machine boot + Node start +
  # CLIP model load before serving the first request. With a single always-on
  # shared-CPU machine this is a few $/mo.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
